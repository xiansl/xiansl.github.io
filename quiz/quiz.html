<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>现场答题 · Kahoot 风格</title>
<script src="./mqtt.min.js"></script>
<script src="./qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    font-family: "Montserrat", -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg,#46178f 0%,#2c0b5c 100%);
    color: #fff;
    overflow-x: hidden;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1,h2,h3 { margin: 0 0 12px; font-weight: 800; letter-spacing: 0.5px; }
  .card {
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 24px;
    margin: 16px 0;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  button {
    font-family: inherit;
    font-size: 18px; font-weight: 700;
    padding: 14px 28px;
    border: 0; border-radius: 12px;
    background: #26890c; color: white;
    cursor: pointer;
    box-shadow: 0 4px 0 #1a6307;
    transition: transform .05s;
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #1a6307; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: #fff; color: #46178f; box-shadow: 0 4px 0 #ccc; }
  input, select {
    font-family: inherit;
    font-size: 18px; padding: 12px 16px;
    border-radius: 10px; border: 0;
    background: #fff; color: #333;
    width: 100%; margin: 6px 0;
  }
  label { display:block; font-size:14px; color:#c7b8e0; margin-top:8px; }

  .lobby-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { .lobby-grid { grid-template-columns: 1fr; } }
  .pin {
    font-size: 72px; font-weight: 900; letter-spacing: 8px;
    background: #fff; color: #46178f; padding: 10px 24px;
    border-radius: 12px; display: inline-block;
  }
  #qr canvas { background: #fff; padding: 14px; border-radius: 12px; display: block; }
  .players { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; min-height: 60px; }
  .chip {
    background: #ff3355; padding: 10px 16px; border-radius: 20px;
    font-weight: 700; animation: pop .3s ease-out;
  }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  .q-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .timer {
    width: 90px; height: 90px; border-radius: 50%;
    background: #fff; color: #46178f;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 900;
  }
  .q-text {
    background: #fff; color: #333;
    font-size: 36px; font-weight: 800;
    padding: 32px; border-radius: 16px; text-align: center;
    margin-bottom: 20px; min-height: 120px;
    display: flex; align-items: center; justify-content: center;
  }
  .opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .opt {
    display: flex; align-items: center; gap: 16px;
    padding: 22px; border-radius: 14px;
    font-size: 22px; font-weight: 700; color: #fff;
    cursor: pointer; border: 0; text-align: left;
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
    min-height: 90px;
  }
  .opt .shape { font-size: 28px; }
  .opt.c0 { background: #e21b3c; }
  .opt.c1 { background: #1368ce; }
  .opt.c2 { background: #d89e00; }
  .opt.c3 { background: #26890c; }
  .opt.dim { opacity: .3; }
  .opt.hit { outline: 6px solid #fff; }

  .bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: end; height: 220px; margin-top: 20px; }
  .bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar .fill { width: 100%; border-radius: 10px 10px 0 0; transition: height .8s ease-out; min-height: 4px; }
  .bar .lbl { margin-top: 8px; font-weight: 700; }
  .bar.c0 .fill { background: #e21b3c; }
  .bar.c1 .fill { background: #1368ce; }
  .bar.c2 .fill { background: #d89e00; }
  .bar.c3 .fill { background: #26890c; }
  .bar.correct .fill { outline: 4px solid #fff; }

  .leaderboard { list-style: none; padding: 0; margin: 0; }
  .leaderboard li {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,.12); padding: 14px 20px; border-radius: 12px;
    margin-bottom: 10px; font-size: 20px; font-weight: 700;
    animation: slide .4s ease-out;
  }
  @keyframes slide { from { transform: translateX(-20px); opacity: 0; } to { transform: none; opacity: 1; } }
  .leaderboard .rank { background: #ffc800; color: #46178f; width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; margin-right: 12px; }

  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 20px; margin-top: 30px; }
  .pod { flex: 0 0 180px; text-align: center; border-radius: 14px 14px 0 0; padding: 20px; font-weight: 800; }
  .pod .nm { font-size: 24px; margin-bottom: 8px; }
  .pod .sc { font-size: 20px; color: #ffc800; }
  .pod.p1 { height: 240px; background: linear-gradient(180deg,#ffd700,#b8860b); }
  .pod.p2 { height: 190px; background: linear-gradient(180deg,#c0c0c0,#808080); }
  .pod.p3 { height: 150px; background: linear-gradient(180deg,#cd7f32,#8b4513); }

  .player-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
  .player-opts .opt { min-height: 120px; justify-content: center; font-size: 32px; }
  .big-feedback { text-align: center; padding: 40px 20px; }
  .big-feedback .ic { font-size: 100px; font-weight: 900; margin-bottom: 10px; }
  .big-feedback.ok { background: #26890c; }
  .big-feedback.no { background: #e21b3c; }
  .score-pill {
    display: inline-block; background: #ffc800; color: #46178f;
    padding: 10px 24px; border-radius: 40px; font-size: 24px; font-weight: 800;
    margin-top: 10px;
  }
  .muted { color: #c7b8e0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap"><div id="app">加载中…</div></div>

<script>
window.addEventListener("DOMContentLoaded", () => {
  if (typeof mqtt === "undefined" || typeof QRCode === "undefined") {
    document.getElementById("app").innerHTML =
      '<div class="card">本地库加载失败，请确认 mqtt.min.js 与 qrcode.min.js 与 quiz.html 同目录。</div>';
    return;
  }

  const BROKER = "wss://broker.emqx.io:8084/mqtt";
  const params = new URLSearchParams(location.search);
  const ROOM_ID = params.get("room")
               || (location.hash.match(/room=([^&]+)/)?.[1])
               || "demo-" + Math.random().toString(36).slice(2, 8);
  const TOPIC = `quiz-kahoot/${ROOM_ID}`;

  const QUESTIONS = [
    { q: "端到端处理耗时 2.5 微秒，若在单条链路上连续报单（一单发完立刻发下一单），理论上一秒最多可以报多少单？",
      opts: ["4 万单", "40 万单", "400 万单", "4000 万单"], answer: 1, time: 25 },
    { q: "芝加哥↔纽约约 1200 km。用微波（走空气，≈3×10⁸ m/s）传信息比用光纤（≈2×10⁸ m/s）大约快多少？",
      opts: ["约 20 μs", "约 200 μs", "约 2 ms", "约 20 ms"], answer: 2, time: 30 },
    { q: "端到端 FPGA 直通架构能把延迟压到 <200ns，关键是让谁退出了交易关键路径？",
      opts: ["内存", "PCIe", "交换机", "操作系统"], answer: 1, time: 20 },
    { q: "在交易所撮合中，当买卖订单价格相同时，通常按什么规则决定谁先成交？",
      opts: ["订单数量大的优先", "手续费高的优先", "时间先到的优先（price-time priority）", "随机抽取"], answer: 2, time: 25 },
    { q: "九坤投资的上海办公室位于？",
      opts: ["陆家嘴中心", "外滩金融中心 BFC", "北外滩来福士西塔", "静安嘉里中心"], answer: 2, time: 20 },
  ];
  // 前 5 名得分，之后答对的也有分（slow bonus），答错 0 分
  const RANK_POINTS = [1000, 800, 600, 400, 200];
  const CORRECT_BONUS = 100; // 第 6 名及以后答对的分数
  const SHAPES = ["▲","◆","●","■"];

  const isPlayer = location.hash.startsWith("#player");

  const client = mqtt.connect(BROKER, { clean: true, reconnectPeriod: 2000 });
  const send = (type, data) => client.publish(TOPIC, JSON.stringify({ type, ...data }));
  client.on("connect", () => client.subscribe(TOPIC));

  const app = document.getElementById("app");
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // ============================================================
  // HOST
  // ============================================================
  function hostUI() {
    // id -> { name, college, grade, phone, score }
    const players = new Map();
    // 每题的作答记录：qIdx -> Map(playerId -> { pick, correct, usedMs, correctRank, gain })
    const records = QUESTIONS.map(() => new Map());
    let state = "lobby";
    let qIdx = -1;
    let qStartAt = 0;
    let qTimer = null;
    let correctCount = 0; // 当前题正确计数，用来给 rank

    renderLobby();

    function renderLobby() {
      state = "lobby";
      app.innerHTML = `
        <div class="card">
          <h1>🎯 现场答题</h1>
          <div class="lobby-grid">
            <div>
              <div class="muted">用手机扫码加入</div>
              <div id="qr" style="margin:12px 0"></div>
              <div class="muted">房间 PIN</div>
              <div class="pin">${esc(ROOM_ID)}</div>
            </div>
            <div>
              <h2>已加入 <span id="count">0</span> 人</h2>
              <div id="players" class="players"></div>
              <button id="start" style="margin-top:20px;font-size:22px" disabled>开始答题</button>
              <div class="muted" style="margin-top:8px">至少 1 人才能开始 · 共 ${QUESTIONS.length} 题 · 前 5 名高分，之后答对也有分</div>
            </div>
          </div>
        </div>`;
      const joinUrl = location.origin + location.pathname + location.search + `#player&room=${ROOM_ID}`;
      QRCode.toCanvas(joinUrl, { width: 240, margin: 1 }, (err, canvas) => {
        if (!err) document.getElementById("qr").appendChild(canvas);
      });
      refreshPlayers();
      document.getElementById("start").onclick = nextQuestion;
    }

    function refreshPlayers() {
      const box = document.getElementById("players");
      const cnt = document.getElementById("count");
      if (!box) return;
      box.innerHTML = [...players.values()]
        .map(p => `<div class="chip">${esc(p.name)}</div>`).join("");
      cnt.textContent = players.size;
      const startBtn = document.getElementById("start");
      if (startBtn) startBtn.disabled = players.size === 0;
    }

    function nextQuestion() {
      qIdx++;
      if (qIdx >= QUESTIONS.length) return renderPodium();
      correctCount = 0;
      qStartAt = Date.now();
      const q = QUESTIONS[qIdx];
      state = "question";
      app.innerHTML = `
        <div class="card">
          <div class="q-head">
            <h2>第 ${qIdx+1} / ${QUESTIONS.length} 题</h2>
            <div class="timer" id="timer">${q.time}</div>
          </div>
          <div class="q-text">${esc(q.q)}</div>
          <div class="opts-grid">
            ${q.opts.map((o,i) => `
              <div class="opt c${i}"><span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span></div>
            `).join("")}
          </div>
          <div style="text-align:center;margin-top:20px;font-size:20px">
            已作答 <b id="ansCount">0</b> / ${players.size}
          </div>
        </div>`;
      send("question", { idx: qIdx, q: q.q, opts: q.opts, time: q.time, startAt: qStartAt });

      let remain = q.time;
      const tick = () => {
        remain--;
        const t = document.getElementById("timer");
        if (t) t.textContent = Math.max(remain, 0);
        if (remain <= 0 || records[qIdx].size >= players.size) {
          clearInterval(qTimer);
          setTimeout(renderReveal, 500);
        }
      };
      qTimer = setInterval(tick, 1000);
    }

    function renderReveal() {
      state = "reveal";
      const q = QUESTIONS[qIdx];
      const counts = [0,0,0,0];
      for (const a of records[qIdx].values()) counts[a.pick]++;
      const max = Math.max(1, ...counts);
      send("reveal", { idx: qIdx, answer: q.answer, counts });

      app.innerHTML = `
        <div class="card">
          <h2>答案揭晓</h2>
          <div class="q-text">${esc(q.q)}</div>
          <div class="bars">
            ${counts.map((n,i) => `
              <div class="bar c${i}${i===q.answer?' correct':''}">
                <div class="fill" style="height:${(n/max)*100}%"></div>
                <div class="lbl">${SHAPES[i]} ${esc(q.opts[i])} · ${n}</div>
              </div>`).join("")}
          </div>
          <div style="text-align:center;margin-top:24px">
            <span style="font-size:22px">正确答案：<b>${SHAPES[q.answer]} ${esc(q.opts[q.answer])}</b></span>
          </div>
          <div style="text-align:center;margin-top:12px">
            <span class="muted">本题前 5 名：${RANK_POINTS.join(" / ")} 分 · 之后答对：${CORRECT_BONUS} 分</span>
          </div>
          <div style="text-align:center;margin-top:20px">
            <button id="next">${qIdx+1 < QUESTIONS.length ? "查看排行榜" : "查看最终结果"}</button>
          </div>
        </div>`;
      document.getElementById("next").onclick = renderScoreboard;
    }

    function renderScoreboard() {
      state = "scoreboard";
      const rows = [...players.entries()]
        .map(([id,p]) => ({ id, ...p, gain: records[qIdx].get(id)?.gain || 0 }))
        .sort((a,b) => b.score - a.score);
      send("scoreboard", {
        rows: rows.map(r => ({ name: r.name, score: r.score, gain: r.gain }))
      });

      app.innerHTML = `
        <div class="card">
          <h2>${qIdx+1 < QUESTIONS.length ? "当前排行榜" : "最终排名"}</h2>
          <ul class="leaderboard">
            ${rows.slice(0,10).map((r,i) => `
              <li>
                <span><span class="rank">${i+1}</span>${esc(r.name)}
                  <span class="muted">· ${esc(r.college||"")} ${esc(r.grade||"")}</span>
                </span>
                <span>${r.score} ${r.gain ? `<span style="color:#ffc800;font-size:16px">+${r.gain}</span>` : ""}</span>
              </li>`).join("") || '<li>暂无玩家</li>'}
          </ul>
          <div style="text-align:center;margin-top:20px">
            <button id="next">${qIdx+1 < QUESTIONS.length ? "下一题" : "查看冠军"}</button>
          </div>
        </div>`;
      document.getElementById("next").onclick = () => {
        if (qIdx+1 >= QUESTIONS.length) renderPodium(); else nextQuestion();
      };
    }

    function renderPodium() {
      state = "podium";
      const sorted = [...players.entries()]
        .map(([id,p]) => ({ id, ...p }))
        .sort((a,b) => b.score - a.score);
      const [p1,p2,p3] = sorted;
      send("podium", { top: sorted.slice(0,3).map(p => ({ name: p.name, score: p.score })) });

      app.innerHTML = `
        <div class="card" style="text-align:center">
          <h1>🏆 冠军诞生！</h1>
          <div class="podium">
            ${p2 ? `<div class="pod p2"><div class="nm">${esc(p2.name)}</div><div class="sc">${p2.score}</div><div style="font-size:40px">🥈</div></div>` : ""}
            ${p1 ? `<div class="pod p1"><div class="nm">${esc(p1.name)}</div><div class="sc">${p1.score}</div><div style="font-size:50px">🥇</div></div>` : ""}
            ${p3 ? `<div class="pod p3"><div class="nm">${esc(p3.name)}</div><div class="sc">${p3.score}</div><div style="font-size:40px">🥉</div></div>` : ""}
          </div>
          <div style="margin-top:30px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap">
            <button id="dl">📥 下载成绩 CSV</button>
            <button class="ghost" onclick="location.reload()">再来一局</button>
          </div>
          <div class="muted" style="margin-top:12px">CSV 包含每位同学的注册信息、每题答案、每题得分、总分</div>
        </div>`;
      document.getElementById("dl").onclick = downloadCSV;
    }

    function downloadCSV() {
      const header = ["姓名","学院","年级","手机号","总分"];
      for (let i = 0; i < QUESTIONS.length; i++) {
        header.push(`Q${i+1}选项`, `Q${i+1}是否正确`, `Q${i+1}用时(秒)`, `Q${i+1}正确排名`, `Q${i+1}得分`);
      }
      const sorted = [...players.entries()]
        .map(([id,p]) => ({ id, ...p }))
        .sort((a,b) => b.score - a.score);
      const rows = sorted.map(p => {
        const row = [p.name, p.college||"", p.grade||"", p.phone||"", p.score];
        for (let i = 0; i < QUESTIONS.length; i++) {
          const r = records[i].get(p.id);
          if (!r) { row.push("", "", "", "", 0); continue; }
          row.push(
            QUESTIONS[i].opts[r.pick] ?? "",
            r.correct ? "是" : "否",
            (r.usedMs/1000).toFixed(2),
            r.correctRank || "",
            r.gain
          );
        }
        return row;
      });
      const csv = [header, ...rows].map(r =>
        r.map(v => {
          const s = String(v == null ? "" : v);
          return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
        }).join(",")
      ).join("\r\n");
      const bom = "﻿"; // Excel 识别 UTF-8
      const blob = new Blob([bom + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `quiz-${ROOM_ID}-${new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    client.on("message", (_t, buf) => {
      let m; try { m = JSON.parse(buf.toString()); } catch { return; }
      if (m.type === "join") {
        if (!players.has(m.id)) {
          players.set(m.id, {
            name: m.name || "匿名",
            college: m.college || "",
            grade: m.grade || "",
            phone: m.phone || "",
            score: 0,
          });
          if (state === "lobby") refreshPlayers();
        } else {
          // 更新信息（允许改）
          const p = players.get(m.id);
          Object.assign(p, {
            name: m.name || p.name,
            college: m.college || p.college,
            grade: m.grade || p.grade,
            phone: m.phone || p.phone,
          });
        }
        send("joined", { to: m.id, state });
      }
      if (m.type === "answer" && state === "question" && m.idx === qIdx && !records[qIdx].has(m.id)) {
        const q = QUESTIONS[qIdx];
        const usedMs = Date.now() - qStartAt;
        const correct = m.pick === q.answer;
        let correctRank = 0, gain = 0;
        if (correct) {
          correctCount++;
          correctRank = correctCount;
          gain = RANK_POINTS[correctRank - 1] || CORRECT_BONUS;
        }
        const p = players.get(m.id);
        if (p) p.score += gain;
        records[qIdx].set(m.id, { pick: m.pick, correct, usedMs, correctRank, gain });
        send("ack", { to: m.id, idx: qIdx, correct, gain, correctRank, score: p?.score || 0, answer: q.answer });
        const ac = document.getElementById("ansCount");
        if (ac) ac.textContent = records[qIdx].size;
        if (records[qIdx].size >= players.size) {
          clearInterval(qTimer);
          setTimeout(renderReveal, 500);
        }
      }
    });
  }

  // ============================================================
  // PLAYER
  // ============================================================
  function playerUI() {
    const id = Math.random().toString(36).slice(2, 10);
    const saved = JSON.parse(localStorage.getItem("quiz-profile") || "{}");
    let profile = {
      name: saved.name || "",
      college: saved.college || "",
      grade: saved.grade || "",
      phone: saved.phone || "",
    };
    let myScore = 0;
    let curIdx = -1;

    const askProfile = () => {
      app.innerHTML = `
        <div class="card">
          <h1 style="text-align:center">加入房间</h1>
          <div style="text-align:center"><span class="pin" style="font-size:36px">${esc(ROOM_ID)}</span></div>
          <label>姓名 *</label>
          <input id="f_name" value="${esc(profile.name)}" maxlength="20" placeholder="请输入真实姓名" />
          <label>学院 *</label>
          <input id="f_college" value="${esc(profile.college)}" maxlength="30" placeholder="如：计算机学院" />
          <label>年级 *</label>
          <select id="f_grade">
            <option value="">请选择</option>
            ${["大一","大二","大三","大四","研一","研二","研三","博士","其他"]
              .map(g => `<option ${profile.grade===g?"selected":""}>${g}</option>`).join("")}
          </select>
          <label>手机号 *</label>
          <input id="f_phone" type="tel" inputmode="numeric" value="${esc(profile.phone)}" maxlength="11" placeholder="11 位手机号" />
          <div id="err" style="color:#ffb;margin-top:8px;min-height:20px;font-size:14px"></div>
          <button id="go" style="width:100%;margin-top:12px;font-size:20px">进入</button>
          <div class="muted" style="margin-top:10px;text-align:center">浏览器无法自动读取手机号，请手动输入</div>
        </div>`;
      const err = document.getElementById("err");
      document.getElementById("go").onclick = () => {
        const name    = document.getElementById("f_name").value.trim();
        const college = document.getElementById("f_college").value.trim();
        const grade   = document.getElementById("f_grade").value;
        const phone   = document.getElementById("f_phone").value.trim();
        if (!name)              return err.textContent = "请填写姓名";
        if (!college)           return err.textContent = "请填写学院";
        if (!grade)             return err.textContent = "请选择年级";
        if (!/^1[3-9]\d{9}$/.test(phone)) return err.textContent = "请输入正确的 11 位手机号";
        profile = { name, college, grade, phone };
        localStorage.setItem("quiz-profile", JSON.stringify(profile));
        send("join", { id, ...profile });
        waiting();
      };
    };

    const waiting = (msg) => {
      app.innerHTML = `
        <div class="card" style="text-align:center">
          <h2>${esc(profile.name)}</h2>
          <div class="muted">${esc(profile.college)} · ${esc(profile.grade)}</div>
          <div class="score-pill">${myScore} 分</div>
          <div style="margin-top:30px;font-size:20px">${msg || "等待主持人出题…"}</div>
        </div>`;
    };

    const showQ = (m) => {
      curIdx = m.idx;
      app.innerHTML = `
        <div class="card">
          <div class="q-head">
            <h2>第 ${m.idx+1} 题</h2>
            <div class="score-pill">${myScore}</div>
          </div>
          <div style="text-align:center;margin:16px 0;font-size:18px">选择你的答案（前 5 名高分，之后答对也有分）</div>
          <div class="player-opts">
            ${m.opts.map((_,i) => `<button class="opt c${i}" data-i="${i}">${SHAPES[i]}</button>`).join("")}
          </div>
        </div>`;
      document.querySelectorAll(".opt").forEach(b => {
        b.onclick = () => {
          document.querySelectorAll(".opt").forEach(x => {
            x.disabled = true;
            if (x !== b) x.classList.add("dim");
          });
          b.classList.add("hit");
          send("answer", { id, idx: curIdx, pick: Number(b.dataset.i) });
          setTimeout(() => waiting("已提交，等待其他人作答…"), 400);
        };
      });
    };

    const showResult = (m) => {
      myScore = m.score;
      const rankText = m.correct
        ? (m.correctRank <= 5
            ? `你是第 <b>${m.correctRank}</b> 个答对的，获得 <b>${m.gain}</b> 分`
            : `你答对了（第 ${m.correctRank} 位），获得 <b>${m.gain}</b> 分`)
        : "本题 0 分";
      app.innerHTML = `
        <div class="card big-feedback ${m.correct ? "ok" : "no"}">
          <div class="ic">${m.correct ? "✓" : "✗"}</div>
          <h2>${m.correct ? "回答正确！" : "回答错误"}</h2>
          <div style="font-size:18px;margin-top:8px">${rankText}</div>
          <div style="margin-top:20px;font-size:20px">总分：<b>${myScore}</b></div>
        </div>`;
    };

    const showScoreboard = (m) => {
      const me = m.rows.findIndex(r => r.name === profile.name);
      app.innerHTML = `
        <div class="card" style="text-align:center">
          <h2>${esc(profile.name)}</h2>
          <div class="score-pill">${myScore} 分</div>
          <div style="margin-top:20px;font-size:20px">
            ${me >= 0 ? `当前排名第 <b>${me+1}</b> 名` : "等待下一题…"}
          </div>
        </div>`;
    };

    const showPodium = (m) => {
      const me = m.top.findIndex(p => p.name === profile.name);
      app.innerHTML = `
        <div class="card" style="text-align:center">
          <h1>🏁 答题结束</h1>
          <div class="score-pill" style="font-size:28px">${myScore} 分</div>
          <div style="margin-top:20px;font-size:20px">
            ${me === 0 ? "🥇 恭喜你赢得冠军！" :
              me === 1 ? "🥈 第二名，不错！" :
              me === 2 ? "🥉 第三名，上台领奖！" :
              "感谢参与，期待下次挑战！"}
          </div>
        </div>`;
    };

    client.on("connect", () => {
      if (!profile.name || !profile.college || !profile.grade || !profile.phone) askProfile();
      else { send("join", { id, ...profile }); waiting(); }
    });
    client.on("message", (_t, buf) => {
      let m; try { m = JSON.parse(buf.toString()); } catch { return; }
      if (m.to && m.to !== id) return;
      if (m.type === "question") showQ(m);
      else if (m.type === "ack")        showResult(m);
      else if (m.type === "scoreboard") showScoreboard(m);
      else if (m.type === "podium")     showPodium(m);
    });
  }

  if (isPlayer) playerUI(); else hostUI();
});
</script>
</body>
</html>
